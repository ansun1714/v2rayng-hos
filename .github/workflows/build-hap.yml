name: build-unsigned-hap

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 需要在 tag hap-latest 上创建/更新 Release 并替换资产

jobs:
  build:
    name: hvigor assembleHap (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OHOS_SDK_RELEASE: "5.0.3-Release"
      SDK_API: "15"
      SDK_ROOT: ${{ github.workspace }}/.ohos-sdk
      HAP_MODULE: "entry@default"
      HAP_PRODUCT: "default"
      HVIGOR_VER: "5.19.8"
      # @ohos/hvigor 与 @ohos/hvigor-ohos-plugin 只发布在华为源，境外 runner 拉取不稳，
      # 故把这两个自包含 tarball 镜像到本仓库的 Release（见 tag hvigor-5.19.8）。
      HVIGOR_RELEASE_BASE: https://github.com/ansun1714/v2rayng-hos/releases/download/hvigor-5.19.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # SDK 约 4.3GB，缓存在 workspace 下，命中后跳过下载
      - name: Cache OpenHarmony SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_ROOT }}/${{ env.SDK_API }}
          key: ohos-sdk-${{ env.OHOS_SDK_RELEASE }}-api${{ env.SDK_API }}-linux-v3

      - name: Download OpenHarmony SDK (cache miss)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://repo.huaweicloud.com/openharmony/os/${OHOS_SDK_RELEASE}/ohos-sdk-windows_linux-public.tar.gz"
          echo "== downloading =="
          curl -fSL --retry 5 --retry-delay 15 --connect-timeout 30 \
               -o /tmp/ohos-sdk.tar.gz "$url"
          ls -lh /tmp/ohos-sdk.tar.gz
          df -h /tmp | tail -n 1

          echo "== extracting tar =="
          mkdir -p /tmp/sdk-x
          tar -xzf /tmp/ohos-sdk.tar.gz -C /tmp/sdk-x
          rm -f /tmp/ohos-sdk.tar.gz   # 4.3GB，先释放

          # 包结构：ohos-sdk/linux/{ets,js,native,previewer,toolchains}-linux-x64-<ver>-Release.zip
          linux_dir="$(find /tmp/sdk-x -maxdepth 4 -type d -name linux -print -quit)"
          if [ -z "$linux_dir" ]; then
            echo "::error::no 'linux' directory inside archive"
            find /tmp/sdk-x -maxdepth 3 -type d | head -n 40
            exit 1
          fi
          echo "linux sdk dir: $linux_dir"

          mkdir -p "$SDK_ROOT/${SDK_API}"
          shopt -s nullglob
          zips=("$linux_dir"/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no component zips in $linux_dir"
            ls -la "$linux_dir"
            exit 1
          fi

          for z in "${zips[@]}"; do
            echo "== unzip $(basename "$z") =="
            unzip -l "$z" | head -n 12
            unzip -q -o "$z" -d "$SDK_ROOT/${SDK_API}"
            rm -f "$z"     # 边解压边删，控制磁盘占用
          done

          # manifest 里有各组件版本与许可信息，一并放到 SDK 根
          manifest="$(find /tmp/sdk-x -maxdepth 3 -name 'manifest_tag.xml' -print -quit || true)"
          if [ -n "$manifest" ]; then
            cp -f "$manifest" "$SDK_ROOT/${SDK_API}/manifest_tag.xml" || true
            cp -f "$manifest" "$SDK_ROOT/manifest_tag.xml" || true
          fi
          rm -rf /tmp/sdk-x

          # 布局自愈：zip 内若多包一层（<api>/ets 或 ets/ets），拍平
          if [ -d "$SDK_ROOT/${SDK_API}/${SDK_API}" ]; then
            echo "flattening nested ${SDK_API}/"
            cp -a "$SDK_ROOT/${SDK_API}/${SDK_API}/." "$SDK_ROOT/${SDK_API}/"
            rm -rf "$SDK_ROOT/${SDK_API}/${SDK_API}"
          fi
          for c in ets js native previewer toolchains; do
            if [ -d "$SDK_ROOT/${SDK_API}/$c/$c" ]; then
              echo "flattening nested $c/$c"
              mv "$SDK_ROOT/${SDK_API}/$c/$c" "$SDK_ROOT/${SDK_API}/$c.tmp"
              rm -rf "$SDK_ROOT/${SDK_API}/$c"
              mv "$SDK_ROOT/${SDK_API}/$c.tmp" "$SDK_ROOT/${SDK_API}/$c"
            fi
          done

          echo "== sdk layout =="
          ls -la "$SDK_ROOT/${SDK_API}"
          for c in ets js native previewer toolchains; do
            if [ -f "$SDK_ROOT/${SDK_API}/$c/oh-uni-package.json" ]; then
              echo "$c: ok"
            else
              echo "$c: MISSING oh-uni-package.json"
              ls -la "$SDK_ROOT/${SDK_API}/$c" 2>/dev/null | head -n 10 || true
            fi
          done
          du -sh "$SDK_ROOT/${SDK_API}"

          test -f "$SDK_ROOT/${SDK_API}/ets/oh-uni-package.json"
          test -d "$SDK_ROOT/${SDK_API}/toolchains"

      # hvigor 的 tarball 自带全部依赖（bundled deps），解压即可，不需要 npm 解析依赖树。
      # GitHub Release 的 CDN 偶发 504，这里做本地缓存 + 直链失败时回退到 API asset 下载。
      - name: Cache hvigor tarballs
        uses: actions/cache@v4
        with:
          path: .hvigor-pkgs
          key: hvigor-pkgs-${{ env.HVIGOR_VER }}

      - name: Install hvigor (tarballs from release)
        env:
          GH_TOKEN_FOR_ASSETS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .hvigor-pkgs
          cd app
          rm -rf node_modules
          for pkg in hvigor hvigor-ohos-plugin; do
            echo "== $pkg =="
            tarball="../.hvigor-pkgs/ohos-$pkg-${HVIGOR_VER}.tgz"
            if [ ! -s "$tarball" ]; then
              url="$HVIGOR_RELEASE_BASE/ohos-$pkg-${HVIGOR_VER}.tgz"
              echo "downloading $url"
              if ! curl -fSL --retry 8 --retry-delay 15 --retry-all-errors --max-time 900 \
                   -o "$tarball" "$url"; then
                echo "direct release URL failed, falling back to API asset download"
                rm -f "$tarball"
                asset_url="$(curl -sS --retry 5 --retry-all-errors \
                  -H "Authorization: Bearer ${GH_TOKEN_FOR_ASSETS}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/hvigor-${HVIGOR_VER}" \
                  | jq -r --arg n "ohos-$pkg-${HVIGOR_VER}.tgz" '.assets[] | select(.name==$n) | .url' | head -n 1)" || true
                if [ -z "${asset_url:-}" ]; then
                  echo "::error::cannot locate release asset for $pkg"
                  exit 1
                fi
                curl -fSL --retry 8 --retry-delay 15 --retry-all-errors --max-time 900 \
                  -H "Authorization: Bearer ${GH_TOKEN_FOR_ASSETS}" \
                  -H "Accept: application/octet-stream" \
                  -o "$tarball" "$asset_url"
              fi
            else
              echo "using cached $tarball"
            fi
            ls -lh "$tarball"
            mkdir -p "node_modules/@ohos/$pkg"
            tar -xzf "$tarball" -C "node_modules/@ohos/$pkg" --strip-components=1
            test -f "node_modules/@ohos/$pkg/package.json"
          done
          test -f node_modules/@ohos/hvigor/bin/hvigor.js
          echo "hvigor installed"

      # OpenHarmony 5.0.3 公共 SDK 里 module.json5 的 schema 枚举与 NetworkKit 导出都没有
      # vpn 扩展类型，直接构建会报 00303038 Schema validate failed（extensionAbilities[0].type）。
      # ci/ohos-sdk-patch 下是同一版本 SDK 中对应的 Apache-2.0 文件，覆盖后 hvigor 才能通过
      # 配置校验并解析 VpnExtensionAbility / vpnExtension。
      - name: Patch SDK for VPN extension support
        run: |
          set -euo pipefail
          echo "== patch files =="
          find ci/ohos-sdk-patch -type f | sort
          # 补丁包内已含 15/ 这一层，目标是 SDK 的 <api>/ 目录
          cp -a ci/ohos-sdk-patch/15/. "$SDK_ROOT/${SDK_API}/"
          echo "== verify =="
          if [ -d "$SDK_ROOT/${SDK_API}/15" ]; then
            echo "::error::patch created a nested 15/ dir, copy path is wrong"
            exit 1
          fi
          vpn_count="$(grep -c '"vpn"' "$SDK_ROOT/${SDK_API}/toolchains/modulecheck/module.json" || true)"
          echo "vpn entries in module schema: $vpn_count"
          if [ "${vpn_count:-0}" -lt 1 ]; then
            echo "::error::module.json schema still has no vpn type"
            exit 1
          fi
          kit_count="$(grep -c 'vpnExtension' "$SDK_ROOT/${SDK_API}/ets/kits/@kit.NetworkKit.d.ts" || true)"
          echo "vpnExtension references in @kit.NetworkKit: ${kit_count:-0}"
          if [ "${kit_count:-0}" -lt 1 ]; then
            echo "::error::@kit.NetworkKit.d.ts does not export vpnExtension"
            exit 1
          fi
          test -f "$SDK_ROOT/${SDK_API}/ets/api/@ohos.net.vpnExtension.d.ts"
          echo "patch applied"

      - name: Build HAP (no signing config => unsigned)
        run: |
          set -euo pipefail
          export OHOS_BASE_SDK_HOME="$SDK_ROOT"
          export OHOS_SDK_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/${SDK_API}/toolchains:$PATH"
          export NODE_OPTIONS="--max-old-space-size=8192"
          cd app
          node node_modules/@ohos/hvigor/bin/hvigor.js \
            --mode module \
            -p "module=${HAP_MODULE}" \
            -p "product=${HAP_PRODUCT}" \
            assembleHap --no-daemon

          echo "== build outputs =="
          find entry/build -name "*.hap" -type f -exec ls -lh {} \;

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find app/entry/build -name "*.hap" -type f -exec cp -v {} out/ \;
          echo "== collected =="
          ls -lh out
          echo "## unsigned HAP" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.hap; do
            size="$(stat -c%s "$f")"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            echo "collect: $(basename "$f") $size bytes sha256=$sha"
            echo "- file: \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- size: $size bytes" >> "$GITHUB_STEP_SUMMARY"
            echo "- sha256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-ohos-unsigned-hap-api${{ env.SDK_API }}
          path: out/*.hap
          if-no-files-found: error
          retention-days: 30

      # 把成品直接发到 Releases 页的固定位置（tag hap-latest），换掉同名旧资产。
      # 这样下载链接永远是 releases/download/hap-latest/entry-default-unsigned.hap，
      # 不用每次都翻 Actions 页面找 run。PR 来自 fork 时没有写权限，跳过。
      - name: Publish HAP to release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          hap="out/entry-default-unsigned.hap"
          size="$(stat -c%s "$hap")"
          sha="$(sha256sum "$hap" | cut -d' ' -f1)"
          short_sha="$(git rev-parse --short HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          body="$(printf '由 GitHub Actions 在云端自动构建，**未签名**，需要自己签一次名再侧载。\n\n| 项 | 值 |\n| --- | --- |\n| 文件 | `entry-default-unsigned.hap` |\n| 大小 | %s 字节 |\n| SHA256 | `%s` |\n| 构建 | [run #%s](%s/%s/actions/runs/%s) · `%s` |\n| 构建时间 | %s |\n\n包里含 mihomo 内核 `libngcore.so`、NAPI 桥 `libngnapi.so`、`libc++_shared.so`，以及分流数据 `geoip.dat` / `geosite.dat`。\n\n签名与装机步骤见 README「签名与装机」。CI 自己依赖的 hvigor tarball 在 prerelease `hvigor-5.19.8`，不是应用成品。' "$size" "$sha" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$short_sha" "$built_at")"

          rel_id="$(curl -sS "${auth[@]}" "$api/releases/tags/hap-latest" | jq -r '.id // empty')"
          if [ -z "$rel_id" ]; then
            echo "creating release hap-latest"
            payload="$(jq -n --arg t "hap-latest" --arg n "v2rayNG 鸿蒙版 · 最新未签名 HAP（自动构建）" --arg b "$body" '{tag_name:$t,name:$n,body:$b,draft:false,prerelease:false}')"
            rel_id="$(curl -sS "${auth[@]}" -H "Content-Type: application/json" -d "$payload" "$api/releases" | jq -r '.id')"
          else
            echo "updating release hap-latest (id=$rel_id)"
            payload="$(jq -n --arg b "$body" '{body:$b}')"
            curl -sS "${auth[@]}" -X PATCH -H "Content-Type: application/json" -d "$payload" "$api/releases/$rel_id" > /dev/null
            for aid in $(curl -sS "${auth[@]}" "$api/releases/$rel_id/assets" | jq -r '.[] | select(.name=="entry-default-unsigned.hap") | .id'); do
              echo "removing old asset $aid"
              curl -sS "${auth[@]}" -X DELETE "$api/releases/assets/$aid" > /dev/null
            done
          fi

          up="$(curl -sS "${auth[@]}" -H "Content-Type: application/octet-stream" \
                --data-binary "@$hap" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets?name=entry-default-unsigned.hap")"
          echo "$up" | jq -r '"published: id=\(.id) size=\(.size) state=\(.state) url=\(.browser_download_url)"'
          echo "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/hap-latest" >> "$GITHUB_STEP_SUMMARY"
